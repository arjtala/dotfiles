# vim:set ft=tmux:
# Gruvbox Dark, in tmux-oasis's colour roles, for scripts/tmux-theme-preview.
# Colours from https://github.com/morhetz/gruvbox — the SketchyBar and Waybar palette (colors.sh, style.css).

set -g @thm_strong_primary "#d79921"
set -g @thm_primary "#fabd2f"
set -g @thm_light_primary "#fbf1c7"
set -g @thm_secondary "#8ec07c"
set -g @thm_prefix "#fe8019"
set -g @thm_fg "#ebdbb2"
set -g @thm_core "#1d2021"
set -g @thm_mantle "#282828"
set -g @thm_surface "#3c3836"
set -g @thm_visual "#504945"
set -g @thm_red "#fb4934"
set -g @thm_orange "#fe8019"
set -g @thm_yellow "#fabd2f"
set -g @thm_green "#b8bb26"
set -g @thm_teal "#8ec07c"
set -g @thm_blue "#83a598"
set -g @thm_indigo "#d3869b"
