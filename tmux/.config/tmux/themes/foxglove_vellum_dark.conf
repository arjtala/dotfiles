# vim:set ft=tmux:
# Foxglove Vellum Dark, in tmux-oasis's colour roles, for scripts/tmux-theme-preview.
# Colours from https://gitlab.com/vegasharmon/foxglove-themes: the vellum-dark paper
# and dark hues; plum is the accent and sage the secondary, as in Emacs.

set -g @thm_strong_primary "#d874b9"
set -g @thm_primary "#d392b6"
set -g @thm_light_primary "#aba59d"
set -g @thm_secondary "#8bb177"
set -g @thm_prefix "#c1a262"
set -g @thm_fg "#d6d1ca"
set -g @thm_core "#25211a"
set -g @thm_mantle "#25211a"
set -g @thm_surface "#37322b"
set -g @thm_visual "#443f38"
set -g @thm_red "#e78d86"
set -g @thm_orange "#e49073"
set -g @thm_yellow "#cb9e5c"
set -g @thm_green "#8bb177"
set -g @thm_teal "#6fb0bf"
set -g @thm_blue "#a1bbfe"
set -g @thm_indigo "#a1a0d8"
