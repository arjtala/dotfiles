# vim:set ft=tmux:
# Foxglove Mono Dark, in tmux-oasis's colour roles, for scripts/tmux-theme-preview.
# Colours from https://gitlab.com/vegasharmon/foxglove-themes: the mono-dark paper
# and mono-dark hues; plum is the accent and sage the secondary, as in Emacs.

set -g @thm_strong_primary "#dddddd"
set -g @thm_primary "#bbbbbb"
set -g @thm_light_primary "#bbbbbb"
set -g @thm_secondary "#bbbbbb"
set -g @thm_prefix "#bbbbbb"
set -g @thm_fg "#eeeeee"
set -g @thm_core "#111111"
set -g @thm_mantle "#111111"
set -g @thm_surface "#333333"
set -g @thm_visual "#444444"
set -g @thm_red "#bbbbbb"
set -g @thm_orange "#bbbbbb"
set -g @thm_yellow "#bbbbbb"
set -g @thm_green "#bbbbbb"
set -g @thm_teal "#bbbbbb"
set -g @thm_blue "#cccccc"
set -g @thm_indigo "#bbbbbb"
