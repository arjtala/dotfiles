# Shared styling for every palette.
set -gF message-style "fg=#{@thm_primary},bg=#{@thm_mantle},align=centre"
set -gF message-command-style "fg=#{@thm_secondary},bg=#{@thm_mantle},align=centre"
set -gF mode-style "bg=#{@thm_visual},fg=#{@thm_fg},bold"
set -gF clock-mode-colour "#{@thm_primary}"

%if "#{>=:#{version},3.4}"
  set -gF menu-selected-style "fg=#{@thm_fg},bold,bg=#{@thm_surface}"
  set -gF popup-style "bg=#{@thm_core},fg=#{@thm_fg}"
  set -gF popup-border-style "fg=#{@thm_surface}"
%endif

setw -gF pane-active-border-style "bg=#{@thm_mantle},fg=#{@thm_primary}"
setw -gF pane-border-style "bg=#{@thm_mantle},fg=#{@thm_surface}"
set -gF status-style "bg=#{@thm_mantle},fg=#{@thm_secondary}"
set -gF window-status-last-style "bg=#{@thm_mantle},fg=#{@thm_strong_primary}"
set -gF window-status-activity-style "bg=#{@thm_strong_primary},fg=#{@thm_core}"
set -gF window-status-bell-style "bg=#{@thm_strong_primary},fg=#{@thm_core},bold"

# The 16 ANSI colours programs ask for (prompt, ls, git), so they follow the
# palette instead of the outer terminal's.  Inside Emacs's ghostel those come
# from the Emacs theme, where pure's blue path can vanish on a dark pane.
setw -gF pane-colours[0] "#{@thm_core}"
setw -gF pane-colours[1] "#{@thm_red}"
setw -gF pane-colours[2] "#{@thm_green}"
setw -gF pane-colours[3] "#{@thm_yellow}"
setw -gF pane-colours[4] "#{@thm_blue}"
setw -gF pane-colours[5] "#{@thm_indigo}"
setw -gF pane-colours[6] "#{@thm_teal}"
setw -gF pane-colours[7] "#{@thm_fg}"
setw -gF pane-colours[8] "#{@thm_visual}"
setw -gF pane-colours[9] "#{@thm_red}"
setw -gF pane-colours[10] "#{@thm_green}"
setw -gF pane-colours[11] "#{@thm_yellow}"
setw -gF pane-colours[12] "#{@thm_blue}"
setw -gF pane-colours[13] "#{@thm_indigo}"
setw -gF pane-colours[14] "#{@thm_teal}"
setw -gF pane-colours[15] "#{@thm_light_primary}"

set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
