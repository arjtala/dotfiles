# vim:set ft=tmux:
# Foxglove Vellum, in tmux-oasis's colour roles, for scripts/tmux-theme-preview.
# Colours from https://gitlab.com/vegasharmon/foxglove-themes: the vellum-light paper
# and light hues; plum is the accent and sage the secondary, as in Emacs.

set -g @thm_strong_primary "#b45498"
set -g @thm_primary "#894e70"
set -g @thm_light_primary "#656058"
set -g @thm_secondary "#476933"
set -g @thm_prefix "#795c19"
set -g @thm_fg "#3b3631"
set -g @thm_core "#fefcf8"
set -g @thm_mantle "#fefcf8"
set -g @thm_surface "#eee7df"
set -g @thm_visual "#e0d9d0"
set -g @thm_red "#9a4844"
set -g @thm_orange "#984b30"
set -g @thm_yellow "#82590b"
set -g @thm_green "#476933"
set -g @thm_teal "#266977"
set -g @thm_blue "#263fa7"
set -g @thm_indigo "#5e5b8e"
