# Client-specific connection cues. SSH_CONNECTION in tmux's server/session
# environment can be stale or inherited from a different attached client.
set -g @connection_is_ssh '#{m:* #{client_pid} *,#{@ssh_client_pids}}'
set -g @connection_bg '#{?#{E:@connection_is_ssh},#262626,#{@thm_mantle}}'
set -g @connection_accent '#{?#{E:@connection_is_ssh},#a89984,#{@thm_primary}}'
set -g status-interval 15
set -g status-bg default
set -g status-fg default
set -g status-style 'bg=#{E:@connection_bg},fg=#{E:@connection_accent}'
set -g status-left '#[bg=#{E:@connection_accent},fg=#{@thm_core},bold] #{?#{E:@connection_is_ssh},SSH,LOCAL} #h #[bg=#{E:@connection_bg},fg=#{E:@connection_accent}] #S '
set -g status-right '#[bg=#{E:@connection_bg},fg=#{E:@connection_accent}]#{?client_prefix, PREFIX ,} %H:%M  %F '
set -g window-status-format '#[bg=#{E:@connection_bg},fg=#{E:@connection_accent}] #I #W '
set -g window-status-current-format '#[bg=#{E:@connection_accent},fg=#{@thm_core},bold] #I #W #[default]'
set -g window-status-separator ''
setw -g pane-active-border-style 'bg=#{E:@connection_bg},fg=#{E:@connection_accent}'
setw -g pane-border-style 'bg=#{E:@connection_bg},fg=#{@thm_surface}'
setw -g window-style 'bg=#{?#{E:@connection_is_ssh},#32302f,#{@thm_mantle}}'
setw -g window-active-style 'bg=#{?#{E:@connection_is_ssh},#32302f,#{@thm_mantle}}'
set-hook -g after-new-window[101] 'run-shell -b "~/.config/tmux/tmux-client-context"'
set-hook -g client-attached[101] 'run-shell -b "~/.config/tmux/tmux-client-context"'
set-hook -g client-detached[101] 'run-shell -b "~/.config/tmux/tmux-client-context"'
set-hook -g client-session-changed[101] 'run-shell -b "~/.config/tmux/tmux-client-context"'
set-hook -g client-focus-in[101] 'run-shell -b "~/.config/tmux/tmux-client-context"'
run-shell -b '~/.config/tmux/tmux-client-context'
