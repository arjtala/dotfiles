setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Renumber windows
set -g renumber-windows off

# Window names are managed by the cached smart-label hooks below.
setw -g automatic-rename off
setw -g automatic-rename-format '#{@smart_window_label}'

# Allows for faster key repetition
set -s escape-time 0

# Scroll History
set -g history-limit 30000

# Mouse
set -g mouse on
set-option -s set-clipboard on
# Mouse-drag copy handled by tmux-yank (auto-detects mac/linux/wsl).
bind-key b set-option status

set-option -g default-shell /bin/zsh
set -g @shell_mode 'vi'  # tmux-yank option.
set -g @yank_selection 'primary'  # tmux-yank option.

# ----------
# Theme — chosen conditionally after TPM loads (see bottom of file).
# Both theme plugins live as submodules under ~/.tmux/plugins and are sourced
# directly (not via `set -g @plugin`) so TPM doesn't auto-load either one
# and the conditional can pick exactly one.

# ----------
# Productivity plugins

# fzf picker over URLs visible in the pane (prefix + u)
set -g @plugin 'wfxr/tmux-fzf-url'

# Vimium-style on-screen copy hints (prefix + F)
# Written in Rust; TPM runs `cargo build` on first install.
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key F

# fzf-driven scrollback search (prefix + /)
# Default key is `?` which would shadow tmux's list-keys.
set -g @plugin 'roosta/tmux-fuzzback'
set -g @fuzzback-bind '/'

# Auto-reload tmux.conf on save (needs `entr` in PATH: brew install entr)
set -g @plugin 'b0o/tmux-autoreload'


set -g @tpm_plugins '
	tmux-plugins/tpm
	tmux-plugins/tmux-sensible
	nhdaly/tmux-scroll-copy-mode
	tmux-plugins/tmux-yank
	tmux-plugins/tmux-resurrect
	tmux-plugins/tmux-continuum
'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set-environment -g PATH "/opt/homebrew/bin:$HOME/.local/bin:/usr/local/bin:/bin:/usr/bin"
run '~/.tmux/plugins/tpm/tpm'

# Theme selection:
#   - local (no SSH_CONNECTION): oasis (flavor below) + matching Ghostty theme,
#     both generated by scripts/oasis-theme
#   - remote (SSH'd in):         tmux-power, safer against unknown terminal bg
# Must come AFTER tpm so the plugins' own options exist.
if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -g @tmux_power_theme '#a89984'
  set -g window-style 'bg=#32302f'
  set -g window-active-style 'bg=#32302f'
  run '~/.tmux/plugins/tmux-power/tmux-power.tmux'
} {
  set -g @oasis_flavor 'dune_dark'
  run '~/.tmux/plugins/tmux-oasis/oasis.tmux'
  source-file ~/.config/tmux/woodland-dusk.conf
  # Re-sync legacy status-bg/fg to oasis palette (see prior commit for why).
  set -Fg status-bg '#{@thm_mantle}'
  set -Fg status-fg '#{@thm_secondary}'
}

# Repo-aware labels are cached in pane options.  Never use #() in redraw-time
# formats: streaming applications can make tmux launch those commands on every
# refresh.  The hooks below and the zsh prompt hooks refresh labels only when
# pane state actually changes.
# Show a short title on each pane border. Pane-scoped manual labels win, then
# the cached label, with the current command as a startup fallback.
setw -g pane-border-status top
setw -g pane-border-format "#{?pane_active,#[bold],} #{pane_index} #{=/48/...:#{?@smart_label,#{@smart_label},#{?@smart_pane_label,#{@smart_pane_label},#{pane_current_command}}}} #[default]"
bind-key T command-prompt -I "#{@smart_label}" -p "Pane title" "set-option -p @smart_label '%%'"

# Refresh cached labels on structural/focus changes. Indexed hooks make reloads
# idempotent and avoid replacing hooks owned by plugins.
set-hook -g after-new-window[100] 'run-shell -b -d 0.1 "~/.config/tmux/tmux-smart-label refresh #{pane_id}"'
set-hook -g after-split-window[100] 'run-shell -b -d 0.1 "~/.config/tmux/tmux-smart-label refresh #{pane_id}"'
set-hook -g after-select-pane[100] 'run-shell -b "~/.config/tmux/tmux-smart-label refresh #{pane_id}"'
set-hook -g after-select-window[100] 'run-shell -b "~/.config/tmux/tmux-smart-label refresh #{pane_id}"'

# Populate every existing pane when this file is loaded.
run-shell -b '~/.config/tmux/tmux-smart-label refresh-all'
