# vim:set ft=tmux:
# Foxglove Mono, in tmux-oasis's colour roles, for scripts/tmux-theme-preview.
# Colours from https://gitlab.com/vegasharmon/foxglove-themes: the mono-light paper
# and mono-light hues; plum is the accent and sage the secondary, as in Emacs.

set -g @thm_strong_primary "#222222"
set -g @thm_primary "#444444"
set -g @thm_light_primary "#444444"
set -g @thm_secondary "#444444"
set -g @thm_prefix "#444444"
set -g @thm_fg "#000000"
set -g @thm_core "#ffffff"
set -g @thm_mantle "#ffffff"
set -g @thm_surface "#eeeeee"
set -g @thm_visual "#cccccc"
set -g @thm_red "#444444"
set -g @thm_orange "#444444"
set -g @thm_yellow "#444444"
set -g @thm_green "#444444"
set -g @thm_teal "#444444"
set -g @thm_blue "#222222"
set -g @thm_indigo "#444444"
