# AeroSpace config — matched to sway/i3 keybindings
# i3/sway $super → cmd (alt/option reserved for Emacs Meta key)
# Keys that clash with macOS essentials (v/z/x/a/space) use ctrl instead

start-at-login = true

# Notify SketchyBar and remember window placement. The guard listens for
# AeroSpace's own focus/detection events; it does not poll Accessibility.
after-startup-command = [
  'exec-and-forget sketchybar',
  'exec-and-forget /usr/bin/env AEROSPACE_BIN=/opt/homebrew/bin/aerospace /Users/arjangt/dotfiles/scripts/aerospace-workspace-guard daemon',
]
exec-on-workspace-change = ['/bin/bash', '-c',
'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE'
]

# i3-like normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Layout defaults
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Matches sway: focus_follows_mouse yes
# Briefly disabled during the Aug 2026 focus-oscillation hunt, on the theory
# that warping the cursor on every focus change could re-trigger focus and loop.
# Cleared: the oscillation was stale AeroSpace state and survived disabling
# this. Restarting AeroSpace is the fix for that class of symptom.
on-focus-changed = ['move-mouse window-lazy-center']

# Matches sway: gaps inner 5, outer 3
[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 3
outer.bottom = 3
# Reserve room for sketchybar (31px tall) — must be per-monitor.
# The macOS menu bar is auto-hidden (_HIHideMenuBar=1), so on an external
# display macOS reserves nothing at the top and the full 31px + 3px gap is
# needed, or windows tile underneath the bar.
# The built-in display has a notch: macOS already excludes a 32px safe area
# (NSScreen.safeAreaInsets.top), which the bar draws into, so only the normal
# 3px gap is needed there. Using 34 on both stacks the two and leaves a hole.
outer.top = [{ monitor.'built-in' = 3 }, 34]
outer.right = 3

# ──────────────────────────────────────────────
# Multi-monitor: pin workspaces to displays
# ──────────────────────────────────────────────
# 'built-in' = MacBook Pro screen, 'secondary' = external HDMI display.
# When the HDMI monitor is unplugged, these fall back to the built-in one.
# Briefly suspected during the Aug 2026 focus hunt: undocked, 'secondary'
# matches nothing, and ws 10 looked like an attractor that swallowed focus.
# Disabling it changed nothing -- focus still drifted to ws 10 -- and after
# restarting AeroSpace the pin tested clean while undocked (ws 7 stays on 7,
# ws 9 -> 9, ws 10 -> 10). The attractor was stale AeroSpace state, not this.
[workspace-to-monitor-force-assignment]
9 = 'secondary'
10 = 'secondary'

# ──────────────────────────────────────────────
# Main mode
# ──────────────────────────────────────────────
[mode.main.binding]

# Launch terminal — sway: $super+Return exec ghostty
# '-n' (new instance) spawns a separate Ghostty PROCESS per window, which for a
# while was blamed for windows vanishing from their workspace. It was not the
# cause: the vanishing was stale AeroSpace state and stopped after restarting
# AeroSpace, with '-na' still in place. Keep '-na' -- the alternatives do not
# work here:
#   open -a Ghostty      -> only focuses, never creates a window (verified)
#   ghostty +new-window  -> listed in +help, but errors "not supported on this
#                           platform" on macOS
#   osascript 'new window' (Ghostty.sdef has a real AppleScript dictionary)
#                        -> creates the window in the existing process, but it
#                           registered with AeroSpace late and on the wrong
#                           workspace. Worth revisiting; not obviously better.
# Real cost of '-na': closing a window leaves its instance running without one,
# so processes accumulate (8 PIDs for 4 windows after a few launches). If
# AeroSpace starts misbehaving again, check the PID count and restart AeroSpace
# before changing any of this.
cmd-enter = 'exec-and-forget open -na Ghostty'

# Close window — sway: $super+Shift+q kill
cmd-shift-q = 'close'

# ──── Focus (sway: $super+arrows / hjkl) ────
# --boundaries workspace is REQUIRED. The default (all-monitors-outer-frame)
# lets directional focus land on windows that other workspaces have parked
# off-screen, silently teleporting you to that workspace. Measured at 5/15
# traversals on an accordion workspace; 0/15 with this flag.
cmd-left = 'focus --boundaries workspace --boundaries-action stop left'
cmd-down = 'focus --boundaries workspace --boundaries-action stop down'
cmd-up = 'focus --boundaries workspace --boundaries-action stop up'
cmd-right = 'focus --boundaries workspace --boundaries-action stop right'

# ──── Move windows (sway: $super+Shift+arrows) ────
# NOTE: this shadows the macOS "select to start/end of line/document" text
# shortcuts system-wide — an accepted trade for sway muscle memory. Reverted
# the Aug 6 decision to use hjkl instead: unbound, these keys fall through to
# the terminal, which echoes the raw escape tail (ESC [ 1 ; 10 C -> "0C").
cmd-shift-left = 'move left'
cmd-shift-down = 'move down'
cmd-shift-up = 'move up'
cmd-shift-right = 'move right'

# ──── Split orientation (sway: $super+v splitv) ────
# ctrl-v instead of cmd-v to preserve paste
cmd-ctrl-v = 'join-with down'
cmd-backslash = 'join-with right'

# ──── Layout (sway: $super+z/$super+x/$super+a) ────
# ctrl variants to preserve cmd-z (undo), cmd-x (cut), cmd-a (select-all)
# Per AeroSpace docs: v_accordion == i3/sway "stacking", h_accordion == i3/sway "tabbed".
# Use the single-token forms: 'accordion <orientation>' is a toggle chain that preserves
# the current orientation on first press, so both keys would otherwise do the same thing.
cmd-ctrl-z = 'layout v_accordion'
cmd-ctrl-x = 'layout h_accordion'
cmd-ctrl-a = 'layout tiles horizontal vertical'

# ──── Fullscreen (sway: $super+Shift+f) ────
cmd-shift-f = 'fullscreen'

# ──── Float toggle (sway: $super+Space floating toggle) ────
# ctrl-space to preserve cmd-space (Spotlight)
cmd-ctrl-space = 'layout floating tiling'

# ──── Workspace back_and_forth (sway: $super+slash) ────
# cmd-tab can't be overridden (macOS app switcher) — use cmd-slash
cmd-slash = 'workspace-back-and-forth'

# ──── Workspaces (sway: $super+1-9) ────
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 10'

# ──── Move to workspace + focus (sway: $super+Shift+1-9) ────
cmd-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
cmd-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
cmd-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
cmd-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
cmd-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
cmd-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
cmd-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
cmd-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
cmd-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
cmd-shift-0 = ['move-node-to-workspace 10', 'workspace 10']

# ──── Workspace cycling (sway: $super+Control+Right/Left) ────
cmd-ctrl-right = 'workspace next'
cmd-ctrl-left = 'workspace prev'

# ──── Move workspace to monitor ────
cmd-shift-ctrl-left = 'move-workspace-to-monitor prev'
cmd-shift-ctrl-right = 'move-workspace-to-monitor next'

# ──── Direct resize (sway: Shift+Ctrl+h/j/k/l) ────
ctrl-shift-h = 'resize width -50'
ctrl-shift-j = 'resize height +50'
ctrl-shift-k = 'resize height -50'
ctrl-shift-l = 'resize width +50'

# ──── Resize mode (sway: $super+r mode "resize") ────
# cmd-r is reload in browsers — use cmd-ctrl-r to avoid conflict
cmd-ctrl-r = 'mode resize'

# ──── Reload config (sway: $super+Shift+r reload) ────
cmd-shift-r = 'reload-config'

# ──── Flatten workspace tree (useful utility) ────
cmd-ctrl-f = 'flatten-workspace-tree'

# ──────────────────────────────────────────────
# Resize mode (sway: mode "resize")
# ──────────────────────────────────────────────
[mode.resize.binding]
left = 'resize width -50'
down = 'resize height +50'
up = 'resize height -50'
right = 'resize width +50'
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

# ──────────────────────────────────────────────
# Window rules (sway: for_window)
# ──────────────────────────────────────────────

# Windows intermittently drop out of AeroSpace's tracking and are then
# re-detected as brand new windows, which lands them on whichever workspace
# happens to be focused. That single mechanism is behind both "my windows
# vanished" and "windows turned up on the wrong workspace" -- nothing is ever
# actually moved.
#
# Root cause is machine load, not AeroSpace. Measured Aug 2026: load average
# ~270 on 12 cores, ~143 runnable threads, santa.daemon holding ~2.5 cores
# continuously for 11 days (667 CPU-hours), WindowServer pinned above 50%, and
# ~115 browser content processes. Under that, Accessibility API queries time
# out: in 79 of 102 observed disappearances the window's title had already gone
# empty in the poll immediately before it vanished -- AX degrading, not a window
# closing. Outages ran from ~30 seconds to 39 minutes. It hits every app, not
# just Ghostty (Finder 14, Emacs 10, WhatsApp, Chrome, Safari, Firefox).
#
# So no config change can prevent this. What this rule does is make the recovery
# land correctly. Verified: at 20:35:23 a Ghostty window was re-detected while
# ws 10 was focused and still came back to ws 3.
#
# Trade: if one of these windows is deliberately moved elsewhere, the next
# dropout drags it back to 3.
[[on-window-detected]]
  if.app-name-regex-substring = 'Ghostty'
  if.window-title-regex-substring = 'arjangt-fedora|arjangt-login|devvm'
  run = 'move-node-to-workspace 3'

[[on-window-detected]]
  if.app-id = 'com.apple.systempreferences'
  run = 'layout floating'

[[on-window-detected]]
  if.app-id = 'com.apple.finder'
  run = 'layout floating'

[[on-window-detected]]
  if.app-name-regex-substring = 'Calculator'
  run = 'layout floating'

[[on-window-detected]]
  if.app-name-regex-substring = 'Preview'
  run = 'layout floating'

  # Float Emacs child frames (vertico-posframe, ediff, popups)
[[on-window-detected]]
  if.app-name-regex-substring = 'Emacs'
  if.window-title-regex-substring = '^ *\*'
  check-further-callbacks = true
  run = 'layout floating'

[[on-window-detected]]
  if.app-name-regex-substring = 'Emacs'
  if.window-title-regex-substring = '^$'
  run = 'layout floating'
